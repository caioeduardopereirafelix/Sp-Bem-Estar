spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: spbemestar-classifier

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        prefetch: 10
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  mongodb:
    uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:spbemestar}?authSource=admin
  data:
    mongodb:
      gridfs:
        bucket: report-photos

server:
  port: ${WORKER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  file:
    name: ${LOG_FILE:}
  structured:
    format:
      file: ecs

app:
  metrics:
    username: ${METRICS_USER:}
    password: ${METRICS_PASSWORD:}
  classify-api:
    username: ${CLASSIFIER_API_USER:}
    password: ${CLASSIFIER_API_PASSWORD:}

classifier:
  model: ${CLASSIFIER_MODEL:file:models/classifier.onnx}
  model-version: ${CLASSIFIER_MODEL_VERSION:dev}
  confirm-timeout: 5s
