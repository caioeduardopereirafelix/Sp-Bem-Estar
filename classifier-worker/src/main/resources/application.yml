spring:
  config:
    # o .env fica na raiz do repositório; o worker pode ser iniciado de lá ou da própria pasta
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: spbemestar-classifier

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple # o resultado só é dado como entregue após o ack do broker
    template:
      observation-enabled: true # o traceparent vai no header da mensagem
    listener:
      simple:
        observation-enabled: true # e o trace do relato continua aqui
        prefetch: 10
        default-requeue-rejected: false # falha definitiva vai para a DLQ em vez de voltar para a fila
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  mongodb:
    uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:spbemestar}?authSource=admin
  data:
    mongodb:
      gridfs:
        bucket: report-photos

# Só o Actuator usa HTTP: health check e métricas para o Prometheus
server:
  port: ${WORKER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus # prometheus exige METRICS_USER e METRICS_PASSWORD
  endpoint:
    health:
      probes:
        enabled: true
      # status de cada parte (modelo, RabbitMQ, MongoDB), sem os detalhes; o worker não fica exposto na internet
      show-components: always
  # o starter do OpenTelemetry também envia métricas por OTLP; aqui elas saem pelo /actuator/prometheus
  otlp:
    metrics:
      export:
        enabled: false
  # traceId em todo log e propagado por HTTP e RabbitMQ; sem exportar spans, amostrar tudo não custa nada.
  # Para exportar (Tempo, Jaeger), defina MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

# Em produção, LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs troca o console por JSON (Elastic Common Schema).
# LOG_FILE grava também um arquivo em JSON, que o Alloy do docker compose envia para o Loki.
logging:
  file:
    name: ${LOG_FILE:}
  structured:
    format:
      file: ecs

app:
  # Usuário do Prometheus no /actuator/prometheus (HTTP Basic), o mesmo da API; vazio = ninguém lê
  metrics:
    username: ${METRICS_USER:}
    password: ${METRICS_PASSWORD:}
  # Usuário da API em POST /api/classify (HTTP Basic), para conferir a foto na hora do envio; vazio = desligado
  classify-api:
    username: ${CLASSIFIER_API_USER:}
    password: ${CLASSIFIER_API_PASSWORD:}

classifier:
  model: ${CLASSIFIER_MODEL:file:models/classifier.onnx}
  model-version: ${CLASSIFIER_MODEL_VERSION:dev}
  # os rótulos vêm do próprio modelo (metadado "names"); classifier.labels só para modelos sem esse metadado
  confirm-timeout: 5s
