name: spbemestar-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
    compress: "true"

x-healthcheck-http: &health-api
  test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 90s

services:
  caddy:
    image: caddy:2.11.6-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: spbemestar-api
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      SERVER_FORWARD_HEADERS_STRATEGY: native
      RATE_LIMIT_ENABLED: "true"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      APP_NEIGHBORHOODS_IMPORTFILE: /app/data/sp-distritos.geojson
      APP_NEIGHBORHOODS_CITY: São Paulo
      CLASSIFIER_URL: http://worker:8081
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    healthcheck: *health-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: classifier-worker/Dockerfile
    image: spbemestar-worker
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    volumes:
      - ./models:/app/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    restart: unless-stopped
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq/mnesia
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2.11-alpine
    restart: unless-stopped
    logging: *logging
    entrypoint: ["sh", "-c"]
    command:
      - >-
        test -n "$$REDIS_PASSWORD" || { echo "defina REDIS_PASSWORD no deploy/.env" >&2; exit 1; };
        exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no
        --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  rabbitdata:
  mongodata:
