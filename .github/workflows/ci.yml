name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Os testes de integração sobem PostGIS, RabbitMQ e MongoDB com Testcontainers, que já
# sobrescrevem host, porta e credenciais. Estes valores só preenchem os placeholders do
# application.yml, que sem eles impedem a aplicação de subir.
env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: spbemestar
  POSTGRES_USER: spbemestar
  POSTGRES_PASSWORD: ci
  RABBITMQ_HOST: localhost
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: spbemestar
  RABBITMQ_PASSWORD: ci
  MONGO_HOST: localhost
  MONGO_PORT: "27017"
  MONGO_DB: spbemestar
  MONGO_USER: spbemestar
  MONGO_PASSWORD: ci
  REPORTER_HASH: ci-reporter-hash-com-pelo-menos-32-bytes
  JWT_SECRET: ci-jwt-secret-com-pelo-menos-32-bytes

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes
        run: ./mvnw -B verify
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: target/surefire-reports/
          retention-days: 7

  classifier-worker:
    name: Classifier worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: classifier-worker/pom.xml
      - name: Testes
        run: ./mvnw -B -f classifier-worker/pom.xml verify
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: classifier-worker-test-reports
          path: classifier-worker/target/surefire-reports/
          retention-days: 7

  observability:
    name: Observabilidade
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configuração e alertas do Prometheus
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          printf ci > "$RUNNER_TEMP/secrets/metrics_user"
          printf ci > "$RUNNER_TEMP/secrets/metrics_password"
          image=$(docker compose --profile observability config --images | grep prometheus)
          docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" "$image" check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -w /rules -v "$PWD/observability/prometheus:/rules:ro" \
            "$image" test rules alerts.test.yml
      - name: Configuração do Alloy
        run: |
          image=$(docker compose --profile observability config --images | grep alloy)
          docker run --rm -v "$PWD/observability/alloy:/etc/alloy:ro" "$image" fmt /etc/alloy/config.alloy > /dev/null

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compose de produção
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --profile classifier config --quiet
      - name: Imagem da API
        run: docker build -t spbemestar-api .
      - name: Imagem do worker
        run: docker build -f classifier-worker/Dockerfile -t spbemestar-worker .
      - name: A API sobe como usuário sem privilégios e com UTF-8
        run: |
          test "$(docker run --rm --entrypoint id spbemestar-api -u)" = 10001
          test "$(docker run --rm --entrypoint printenv spbemestar-api LANG)" = C.UTF-8
