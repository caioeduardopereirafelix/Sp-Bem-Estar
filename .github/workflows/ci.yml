name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Os testes de integração sobem PostGIS, RabbitMQ e MongoDB com Testcontainers, que já
# sobrescrevem host, porta e credenciais. Estes valores só preenchem os placeholders do
# application.yml, que sem eles impedem a aplicação de subir.
env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: spbemestar
  POSTGRES_USER: spbemestar
  POSTGRES_PASSWORD: ci
  RABBITMQ_HOST: localhost
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: spbemestar
  RABBITMQ_PASSWORD: ci
  MONGO_HOST: localhost
  MONGO_PORT: "27017"
  MONGO_DB: spbemestar
  MONGO_USER: spbemestar
  MONGO_PASSWORD: ci
  REPORTER_HASH: ci-secret
  # Mantém os containers depois dos testes para os logs abaixo (o runner é descartado no fim)
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes
        run: ./mvnw -B verify
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: target/surefire-reports/
          retention-days: 7
      - name: Logs dos containers
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Config.Image}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} {{.State.Error}}' "$c")"
            docker logs --tail 200 "$c" 2>&1
            echo "::endgroup::"
          done

  classifier-worker:
    name: Classifier worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: classifier-worker/pom.xml
      - name: Testes
        run: ./mvnw -B -f classifier-worker/pom.xml verify
      - name: Relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: classifier-worker-test-reports
          path: classifier-worker/target/surefire-reports/
          retention-days: 7
      - name: Logs dos containers
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Config.Image}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} {{.State.Error}}' "$c")"
            docker logs --tail 200 "$c" 2>&1
            echo "::endgroup::"
          done
