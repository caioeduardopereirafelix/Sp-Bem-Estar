version: 2
updates:
  - package-ecosystem: maven
    directories:
      - "/"
      - "/classifier-worker"
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - "/"
      - "/classifier-worker"
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories:
      - "/"
      - "/deploy"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
