# Nos testes todas as requisições vêm de 127.0.0.1; o limite fica desligado, e o RateLimitTests o liga
app:
  rate-limit:
    enabled: false
  metrics:
    username: prometheus-teste
    password: senha-do-prometheus-teste
  # Os testes entram várias vezes com o mesmo e-mail; os limites de verdade ficam no LoginCodeTests
  login:
    resend-interval: 0s
    max-codes-per-hour: 1000
