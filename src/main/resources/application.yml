spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: spbemestar-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  mongodb:
    uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?authSource=admin
  data:
    mongodb:
      gridfs:
        bucket: report-photos

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      status:
        order: DOWN, OUT_OF_SERVICE, DEGRADED, UNKNOWN, UP
        http-mapping:
          DEGRADED: 200
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  file:
    name: ${LOG_FILE:}
  structured:
    format:
      file: ecs

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

app:
  privacy:
    controller: ${PRIVACY_CONTROLLER:}
    contact: ${PRIVACY_CONTACT:}
  push:
    vapid-public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    subject: ${PUSH_VAPID_SUBJECT:}
  reporter:
    hash-secret: ${REPORTER_HASH}
    access-token-ttl: 15m
    refresh-token-ttl: 90d
  security:
    jwt-secret: ${JWT_SECRET}
    token-ttl: 8h
    bootstrap-operator:
      email: ${OPERATOR_EMAIL:}
      name: ${OPERATOR_NAME:Operador}
    bootstrap-ceo:
      email: ${CEO_EMAIL:}
      name: ${CEO_NAME:CEO}
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:SP Bem-Estar}
    log-codes: ${MAIL_LOG_CODES:false}
  metrics:
    username: ${METRICS_USER:}
    password: ${METRICS_PASSWORD:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rules:
      - name: login-code
        method: POST
        path: /api/v1/auth/code
        capacity: 10
        period: 15m
      - name: login-verify
        method: POST
        path: /api/v1/auth/verify
        capacity: 20
        period: 15m
      - name: reports
        method: POST
        path: /api/v1/reports
        capacity: 20
        period: 1h
      - name: reporter-refresh
        method: POST
        path: /api/v1/reporters/refresh
        capacity: 60
        period: 1h
      - name: open311
        method: GET
        path: /open311/**
        capacity: 60
        period: 1m
      - name: metrics
        method: GET
        path: /actuator/prometheus
        capacity: 30
        period: 1m
      - name: api
        path: /api/**
        capacity: 300
        period: 1m
  observability:
    backlog-interval: 30s
    outbox-lag-limit: 5m
  outbox:
    publish-interval-ms: 1000
    batch-size: 100
    confirm-timeout: 5s
  classification:
    min-confidence: 0.6
    precheck:
      url: ${CLASSIFIER_URL:}
      username: ${CLASSIFIER_API_USER:}
      password: ${CLASSIFIER_API_PASSWORD:}
      timeout: 3s
      reject-confidence: 0.8
