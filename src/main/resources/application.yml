spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: spbemestar-api

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é do Flyway, nunca do Hibernate

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated # a outbox só marca o evento como publicado após o ack do broker
    listener:
      simple:
        default-requeue-rejected: false # falha definitiva vai para a DLQ em vez de voltar para a fila
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  mongodb:
    uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}?authSource=admin
  data:
    mongodb:
      gridfs:
        bucket: report-photos

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus

app:
  reporter-hash-secret: ${REPORTER_HASH}
  outbox:
    publish-interval-ms: 1000
    batch-size: 100
    confirm-timeout: 5s
  classification:
    min-confidence: 0.6 # abaixo disso o relato vai para moderação
