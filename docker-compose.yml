name: spbemestar

# Portas publicadas só em 127.0.0.1: sem isso o Docker as abre para a rede inteira, inclusive
# passando por cima do firewall do host (ufw), e os bancos ficariam acessíveis de fora.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:15672:15672" # painel: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Fotos dos relatos (GridFS). Fica na 7.0: o TCMalloc da 8.x se recusa a subir em kernels
  # Linux 6.19 a 7.0.13 (SERVER-121912), o que derruba o CI e máquinas com kernel novo.
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Observabilidade: docker compose --profile observability up -d ---
  # Grafana em http://localhost:3000, Prometheus em http://localhost:9090. A API e o worker continuam
  # rodando no host; o Prometheus os lê por host.docker.internal e o Alloy lê os logs de ./logs.
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    secrets:
      - metrics_user
      - metrics_password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.7.8
    profiles: ["observability"]
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: ["observability"]
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/logs:ro
      - alloydata:/var/lib/alloy/data # posição de leitura de cada arquivo, para não reenviar logs
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin} # com admin, o Grafana pede a troca no primeiro login
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/spbemestar.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki

# O Prometheus lê as credenciais das métricas como arquivos, sem gravá-las na configuração
secrets:
  metrics_user:
    environment: METRICS_USER
  metrics_password:
    environment: METRICS_PASSWORD

volumes:
  pgdata:
  mongodata:
  promdata:
  lokidata:
  alloydata:
  grafanadata:
