# API e worker rodam fora do compose (./mvnw spring-boot:run e java -jar), então o Prometheus os
# alcança pelo host. Em produção, troque os alvos pelos endereços dos serviços.
global:
  scrape_interval: 15s # o rate limit do /actuator/prometheus aceita 30 por minuto
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: spbemestar-api
    metrics_path: /actuator/prometheus
    basic_auth: &metrics-auth
      # METRICS_USER e METRICS_PASSWORD do .env, entregues pelo compose como arquivos
      username_file: /run/secrets/metrics_user
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: classifier-worker
    metrics_path: /actuator/prometheus
    basic_auth: *metrics-auth
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
